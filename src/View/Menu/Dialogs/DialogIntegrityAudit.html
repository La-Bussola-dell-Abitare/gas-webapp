<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; font-size: 13px; }
    .header-box { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; padding: 14px 20px; border-radius: 8px 8px 0 0; }
    .badge-pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
    .card-metric { border-radius: 8px; border: 1px solid #dee2e6; background: white; padding: 10px; text-align: center; }
    .issue-row { background: white; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 10px; padding: 12px; transition: all 0.2s ease; }
    .issue-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .spinner-box { display: flex; align-items: center; justify-content: center; height: 200px; flex-direction: column; }
  </style>
</head>
<body class="p-3">

  <div class="card shadow-sm border-0">
    <div class="header-box d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-0 fw-bold"><i class="bi bi-shield-check me-2"></i>Audit Integrità Relazionale & Auto-Healing</h5>
        <small class="opacity-75">Controllo coerenza dati tra fogli Beneficiari, Nuclei e Google Drive</small>
      </div>
      <button class="btn btn-sm btn-light text-primary fw-bold" onclick="runAudit()"><i class="bi bi-arrow-clockwise me-1"></i>Nuova Scansione</button>
    </div>

    <div class="card-body">
      <!-- Metriche / Contatori -->
      <div class="row g-2 mb-3" id="metrics-bar">
        <div class="col">
          <div class="card-metric">
            <span class="text-muted d-block small">Doppi Intestatari</span>
            <span class="fs-5 fw-bold text-danger" id="count-dup-int">0</span>
          </div>
        </div>
        <div class="col">
          <div class="card-metric">
            <span class="text-muted d-block small">Beneficiari Orfani</span>
            <span class="fs-5 fw-bold text-warning" id="count-orphans">0</span>
          </div>
        </div>
        <div class="col">
          <div class="card-metric">
            <span class="text-muted d-block small">Cartelle Mancanti</span>
            <span class="fs-5 fw-bold text-info" id="count-missing-fold">0</span>
          </div>
        </div>
        <div class="col">
          <div class="card-metric">
            <span class="text-muted d-block small">Cartelle Duplicate</span>
            <span class="fs-5 fw-bold text-danger" id="count-dup-fold">0</span>
          </div>
        </div>
        <div class="col">
          <div class="card-metric">
            <span class="text-muted d-block small">Conflitti Anagrafici</span>
            <span class="fs-5 fw-bold text-secondary" id="count-anagrafica">0</span>
          </div>
        </div>
      </div>

      <!-- Barra Azioni Rapide -->
      <div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-light rounded border">
        <div id="status-label" class="fw-semibold text-muted">Caricamento audit in corso...</div>
        <div>
          <button id="btn-auto-heal" class="btn btn-success btn-sm fw-bold px-3 d-none" onclick="applyBulkAutoHeal()">
            <i class="bi bi-magic me-1"></i>🚀 Esegui Auto-Healing in Blocco
          </button>
        </div>
      </div>

      <!-- Area Lista Anomalie -->
      <div id="issues-container" style="max-height: 380px; overflow-y: auto;">
        <div class="spinner-box" id="spinner">
          <div class="spinner-border text-primary" role="status"></div>
          <span class="mt-2 text-muted fw-semibold">Scansione e verifica relazioni del database...</span>
        </div>
        <div id="issues-list" class="d-none"></div>
      </div>
    </div>

    <div class="card-footer bg-white border-top d-flex justify-content-end p-2">
      <button class="btn btn-secondary btn-sm px-3" onclick="google.script.host.close()">Chiudi</button>
    </div>
  </div>

  <script>
    let currentIssues = [];

    window.addEventListener('DOMContentLoaded', () => {
      runAudit();
    });

    function runAudit() {
      document.getElementById('spinner').classList.remove('d-none');
      document.getElementById('issues-list').classList.add('d-none');
      document.getElementById('btn-auto-heal').classList.add('d-none');
      document.getElementById('status-label').innerText = 'Scansione in corso...';

      google.script.run
        .withSuccessHandler(onAuditComplete)
        .withFailureHandler(onAuditError)
        .runDataIntegrityAuditRPC();
    }

    function onAuditComplete(res) {
      document.getElementById('spinner').classList.add('d-none');
      const listEl = document.getElementById('issues-list');
      listEl.innerHTML = '';
      listEl.classList.remove('d-none');

      if (!res || !res.success) {
        listEl.innerHTML = '<div class="alert alert-danger">Errore durante la scansione di integrità.</div>';
        return;
      }

      currentIssues = res.issues || [];
      document.getElementById('count-dup-int').innerText = res.summary.duplicateIntestatari || 0;
      document.getElementById('count-orphans').innerText = res.summary.orphanBeneficiaries || 0;
      document.getElementById('count-missing-fold').innerText = res.summary.missingFolders || 0;
      document.getElementById('count-dup-fold').innerText = res.summary.duplicateFolders || 0;
      document.getElementById('count-anagrafica').innerText = res.summary.anagraficaConflicts || 0;

      const healableCount = currentIssues.filter(i => i.autoHealable).length;

      if (currentIssues.length === 0) {
        document.getElementById('status-label').innerHTML = '<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i>Nessuna anomalia riscontrata. Database coerente al 100%!</span>';
        listEl.innerHTML = '<div class="text-center py-5 text-muted"><i class="bi bi-patch-check text-success fs-1 d-block mb-2"></i>Tutti i beneficiari, i nuclei e le cartelle Drive risultano allineati e conformi.</div>';
        return;
      }

      document.getElementById('status-label').innerHTML = `Trovate <strong>${currentIssues.length}</strong> anomalie (di cui <strong>${healableCount}</strong> risolvibili automaticamente).`;
      if (healableCount > 0) {
        document.getElementById('btn-auto-heal').classList.remove('d-none');
      }

      currentIssues.forEach(issue => {
        const severityClass = issue.severity === 'ERROR' ? 'bg-danger' : (issue.severity === 'WARNING' ? 'bg-warning text-dark' : 'bg-info');
        const badgeText = issue.severity === 'ERROR' ? 'ERRORE' : (issue.severity === 'WARNING' ? 'ATTENZIONE' : 'INFO');
        
        const card = document.createElement('div');
        card.className = 'issue-row';
        card.id = `issue-card-${issue.id}`;
        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-start mb-1">
            <h6 class="fw-bold mb-0 text-dark">${issue.title}</h6>
            <span class="badge ${severityClass} badge-pill ms-2">${badgeText}</span>
          </div>
          <p class="text-secondary small mb-2">${issue.description}</p>
          <div class="d-flex justify-content-between align-items-center pt-2 border-top">
            <small class="text-muted"><i class="bi bi-lightbulb me-1"></i><em>Soluzione: ${issue.suggestedFix}</em></small>
            ${issue.autoHealable 
              ? `<button class="btn btn-outline-success btn-sm py-0 px-2 fw-semibold" onclick="applySingleFix('${issue.id}')"><i class="bi bi-wrench me-1"></i>Risolvi</button>` 
              : `<span class="badge bg-light text-muted border">Richiede verifica manuale</span>`}
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function onAuditError(err) {
      document.getElementById('spinner').classList.add('d-none');
      const listEl = document.getElementById('issues-list');
      listEl.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Errore di comunicazione: ${err.message || err}</div>`;
      listEl.classList.remove('d-none');
    }

    function applySingleFix(issueId) {
      const card = document.getElementById(`issue-card-${issueId}`);
      if (card) card.style.opacity = '0.5';

      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success) {
            runAudit();
          } else {
            alert("Risoluzione fallita: " + (res.message || "Errore sconosciuto"));
            if (card) card.style.opacity = '1';
          }
        })
        .withFailureHandler((err) => {
          alert("Errore RPC: " + err);
          if (card) card.style.opacity = '1';
        })
        .applyIntegrityFixRPC([issueId]);
    }

    function applyBulkAutoHeal() {
      if (!confirm("Desideri applicare l'Auto-Healing a tutte le anomalie correggibili automaticamente?")) return;

      document.getElementById('btn-auto-heal').disabled = true;
      document.getElementById('btn-auto-heal').innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Risoluzione in corso...';

      google.script.run
        .withSuccessHandler((res) => {
          document.getElementById('btn-auto-heal').disabled = false;
          alert(`Auto-Healing completato! Risolte ${res.healedCount} anomalie.`);
          runAudit();
        })
        .withFailureHandler((err) => {
          document.getElementById('btn-auto-heal').disabled = false;
          alert("Errore Auto-Healing: " + err);
        })
        .applyIntegrityFixRPC(null);
    }
  </script>
</body>
</html>
