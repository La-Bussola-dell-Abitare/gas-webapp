<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; background-color: #f8f9fa; }
    .header-card { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .action-card { background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s ease; }
    .action-card:hover { border-color: #0d6efd; background-color: #f1f8ff; transform: translateY(-1px); }
  </style>
</head>
<body class="p-2">

  <div class="header-card shadow-sm">
    <div class="d-flex justify-content-between align-items-center">
      <span class="badge bg-light text-primary fw-bold px-2 py-1" id="sheet-badge">Foglio Attivo</span>
      <button class="btn btn-sm btn-outline-light py-0 px-2" onclick="refreshContext()"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <h6 class="fw-bold mb-0 mt-2" id="sheet-title">Rilevamento in corso...</h6>
    <small class="opacity-75" id="sheet-desc">Azioni rapide contestuali per la tabella aperta</small>
  </div>

  <div id="actions-container">
    <div class="text-center py-4 text-muted">
      <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
      <div>Caricamento comandi del foglio...</div>
    </div>
  </div>

  <div class="mt-3 p-2 bg-white rounded border small text-muted">
    <i class="bi bi-info-circle me-1 text-primary"></i>Puoi passare a un altro foglio in Google Sheets e cliccare il pulsante di aggiornamento 🔄 per ricaricare le azioni contestuali.
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', refreshContext);

    function refreshContext() {
      google.script.run
        .withSuccessHandler(renderContextActions)
        .withFailureHandler(onError)
        .getActiveContextDataRPC();
    }

    function renderContextActions(ctx) {
      if (!ctx) return;
      document.getElementById('sheet-badge').innerText = ctx.sheetName || 'Foglio';
      document.getElementById('sheet-title').innerText = ctx.title || ctx.sheetName;
      document.getElementById('sheet-desc').innerText = ctx.description || '';

      const container = document.getElementById('actions-container');
      container.innerHTML = '';

      if (!ctx.actions || ctx.actions.length === 0) {
        container.innerHTML = '<div class="alert alert-secondary text-center small">Nessuna azione contestuale specifica per questo foglio.</div>';
        return;
      }

      ctx.actions.forEach(act => {
        const div = document.createElement('div');
        div.className = 'action-card d-flex align-items-center justify-content-between shadow-sm';
        div.onclick = () => executeAction(act.fn);
        div.innerHTML = `
          <div class="d-flex align-items-center">
            <span class="fs-4 me-2">${act.icon || '⚡'}</span>
            <div>
              <div class="fw-bold text-dark">${act.name}</div>
              <small class="text-muted d-block" style="font-size: 11px;">${act.desc || ''}</small>
            </div>
          </div>
          <i class="bi bi-chevron-right text-muted"></i>
        `;
        container.appendChild(div);
      });
    }

    function executeAction(fnName) {
      if (!fnName) return;
      google.script.run
        .withFailureHandler(onError)
        [fnName]();
    }

    function onError(err) {
      alert("Errore azione: " + (err.message || err));
    }
  </script>
</body>
</html>
