name: Clasp Push on Git Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Validate Tests and Push to Google Apps Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate appsscript.json Security
        run: |
          echo "Verifica configurazione di sicurezza in src/appsscript.json prima del deploy..."
          node -e '
            const manifest = require("./src/appsscript.json");
            const access = manifest.webapp && manifest.webapp.access;
            if (access === "ANYONE_ANONYMOUS") {
              console.error("\x1b[31m[ERRORE SICUREZZA] Deploy bloccato: src/appsscript.json ha access impostato su ANYONE_ANONYMOUS!\x1b[0m");
              process.exit(1);
            }
            console.log("\x1b[32m[OK] Manifest conforme per il deploy: access=" + (access || "MYSELF") + "\x1b[0m");
          '

      - name: Run unit test suite
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate with Google
        env:
          CLASP_ACCESS_TOKEN: ${{ secrets.CLASP_ACCESS_TOKEN }}
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.clasprc
          cat <<EOF > ~/.clasprc.json
          {
            "token": {
              "access_token": "$CLASP_ACCESS_TOKEN",
              "refresh_token": "$CLASP_REFRESH_TOKEN",
              "scope": "https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments https://www.googleapis.com/auth/drive.file",
              "token_type": "Bearer"
            },
            "oauth2ClientSettings": {
              "clientId": "$CLASP_CLIENT_ID",
              "clientSecret": "$CLASP_CLIENT_SECRET",
              "redirectUri": "urn:ietf:wg:oauth:2.0:oob"
            }
          }
          EOF

      - name: Push to Google Apps Script
        run: |
          clasp status
          clasp push --force
